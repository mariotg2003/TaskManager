<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>TaskManager</title>
  </head>
  <body>
    <div id="formularioTarea">
      <div class="form-group row col-6">
        <div class="col-6">
          <label for="nombreTarea">Tarea</label>
          <input
            type="text"
            class="form-control"
            name="nombreTarea"
            id="nombreTarea"
            placeholder="Escribe la tarea"
          />
        </div>

        <div class="col-6">
          <label for="estimacionTarea">Estimación</label>
          <input
            type="number"
            class="form-control"
            name="estimacionTarea"
            id="estimacionTarea"
            placeholder="Horas estimadas"
          />
        </div>
      </div>
    </div>

    <div class="container col-12" id="contenedorBotones">
      <div class="btn btn-primary col-4 me-2 botonAccion" id="botonCrearTarea">
        CREAR TAREA
      </div>
      <div class="btn btn-primary col-4 botonAccion" id="botonGuardarTarea">
        EXPORTAR TAREAS
      </div>
    </div>

    <div class="row col-12" id="contenedorTareas">
      <div class="container tablon" id="tareasNoEmpezadas">
        TAREAS SIN EMPEZAR
      </div>
      <div class="container tablon">En Desarrollo</div>
      <div class="container tablon">Pruebas</div>
      <div class="container tablon">Finalizadas</div>
    </div>

    <script type="module" src="logic/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
