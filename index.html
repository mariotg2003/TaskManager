<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>TaskManager</title>
  </head>
  <body>
    <div class="row" id="header">
      <div class="col-12 col-md-6 col-lg-6" id="formularioTarea">
        <div class="form-group row col-6">
          <div class="col-6">
            <label for="nombreTarea">Tarea</label>
            <input
              type="text"
              class="form-control"
              name="nombreTarea"
              id="nombreTarea"
              placeholder="Escribe la tarea"
            />
          </div>

          <div class="col-6">
            <label for="estimacionTarea">Estimación</label>
            <input
              type="text"
              class="form-control"
              name="estimacionTarea"
              id="estimacionTarea"
              placeholder="Prioridad"
            />
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5 col-lg-5" id="contenedorBotones">
        <div class="btn btn-primary me-2 botonAccion" id="botonCrearTarea">
          Añadir Tarea
        </div>
        <div class="btn btn-primary me-2 botonAccion" id="botonGuardarTarea">
          Guardar Tareas
        </div>
        <div class="btn btn-primary me-2 botonAccion" id="botonExportarTarea">
          Cargar Tareas
        </div>
      </div>
    </div>

    <div class="row" id="contenedorTareas">
      <div class="col-3 contenedor">
        <h2>READY</h2>
        <div class="tablon" id="tareasNoEmpezadas"></div>
      </div>

      <div class="col-3 contenedor">
        <h2>DEV</h2>
        <div class="tablon" id="tareasDesarrollo"></div>
      </div>

      <div class="col-3 contenedor">
        <h2>TEST</h2>
        <div class="tablon" id="tareasTesting"></div>
      </div>

      <div class="col-3 contenedor">
        <h2>DONE</h2>
        <div class="tablon" id="tareasDone"></div>
      </div>
    </div>

    <script type="module" src="logic/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
